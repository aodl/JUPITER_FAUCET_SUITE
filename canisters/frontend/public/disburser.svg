    <text class="badge" fill="#F9FAFB" text-anchor="middle" x="162.0" y="379">Neuron</text>
    <circle cx="156" cy="420.0" fill="none" r="4.5" stroke="#D49B28" stroke-width="2"/>
    <line stroke="#D49B28" stroke-width="1.9" x1="156" x2="170.0" y1="420.0" y2="420.0"/>
    <circle cx="170.0" cy="420.0" fill="#E0A12E" r="2.5"/>
    <line stroke="#D49B28" stroke-width="1.9" x1="156" x2="163.0" y1="420.0" y2="432.12435565298216"/>
    <circle cx="163.0" cy="432.12435565298216" fill="#E0A12E" r="2.5"/>
    <line stroke="#D49B28" stroke-width="1.9" x1="156" x2="149.0" y1="420.0" y2="432.12435565298216"/>
    <circle cx="149.0" cy="432.12435565298216" fill="#E0A12E" r="2.5"/>
    <line stroke="#D49B28" stroke-width="1.9" x1="156" x2="142.0" y1="420.0" y2="420.0"/>
    <circle cx="142.0" cy="420.0" fill="#E0A12E" r="2.5"/>
    <line stroke="#D49B28" stroke-width="1.9" x1="156" x2="149.0" y1="420.0" y2="407.87564434701784"/>
    <circle cx="149.0" cy="407.87564434701784" fill="#E0A12E" r="2.5"/>
    <line stroke="#D49B28" stroke-width="1.9" x1="156" x2="163.0" y1="420.0" y2="407.87564434701784"/>
    <circle cx="163.0" cy="407.87564434701784" fill="#E0A12E" r="2.5"/>
    <text class="node-title" x="190" y="417.0">Faucet neuron</text>
    <text class="node-sub" x="190" y="439.0">maturity source</text>
  </g>
  <g class="entity canister jupiter">
    <rect class="body" height="90" rx="23" ry="23" stroke-width="2.2" width="230" x="480" y="375"/>
    <rect fill="#18483C" height="22" rx="11" ry="11" stroke="#2CC39A" stroke-width="1.5" width="87" x="494" y="364"/>
    <text class="badge" fill="#F9FAFB" text-anchor="middle" x="537.5" y="379">Jupiter Faucet</text>
    <rect fill="none" height="24" rx="6" ry="6" stroke="#2CC39A" stroke-width="2.2" width="26" x="501" y="408.0"/>
    <line stroke="#2CC39A" stroke-width="2" x1="507" x2="521" y1="416.0" y2="416.0"/>
    <line stroke="#2CC39A" stroke-width="2" x1="507" x2="521" y1="424.0" y2="424.0"/>
    <text class="node-title" x="544" y="426.0">Disburser</text>
  </g>
  <g class="entity canister jupiter">
    <rect class="body" height="90" rx="23" ry="23" stroke-width="2.2" width="240" x="850" y="375"/>
    <rect fill="#18483C" height="22" rx="11" ry="11" stroke="#2CC39A" stroke-width="1.5" width="87" x="864" y="364"/>
    <text class="badge" fill="#F9FAFB" text-anchor="middle" x="907.5" y="379">Jupiter Faucet</text>
    <rect fill="none" height="24" rx="6" ry="6" stroke="#2CC39A" stroke-width="2.2" width="26" x="871" y="408.0"/>
    <line stroke="#2CC39A" stroke-width="2" x1="877" x2="891" y1="416.0" y2="416.0"/>
    <line stroke="#2CC39A" stroke-width="2" x1="877" x2="891" y1="424.0" y2="424.0"/>
    <text class="node-title" x="914" y="417.0">Faucet</text>
    <text class="node-sub" x="914" y="439.0">age-neutral base</text>
  </g>
  <g class="entity canister jupiter">
    <rect class="body" height="90" rx="23" ry="23" stroke-width="2.2" width="240" x="350" y="575"/>
    <rect fill="#18483C" height="22" rx="11" ry="11" stroke="#2CC39A" stroke-width="1.5" width="87" x="364" y="564"/>
    <text class="badge" fill="#F9FAFB" text-anchor="middle" x="407.5" y="579">Jupiter Faucet</text>
    <rect fill="none" height="24" rx="6" ry="6" stroke="#2CC39A" stroke-width="2.2" width="26" x="371" y="608.0"/>
    <line stroke="#2CC39A" stroke-width="2" x1="377" x2="391" y1="616.0" y2="616.0"/>
    <line stroke="#2CC39A" stroke-width="2" x1="377" x2="391" y1="624.0" y2="624.0"/>
    <text class="node-title" x="414" y="617.0">SNS Rewards</text>
    <text class="node-sub" x="414" y="639.0">95% of age bonus</text>
  </g>
  <g class="entity neuron">
    <polygon fill="#4A3718" points="664,575 886,575 910,620.0 886,665 664,665 640,620.0" stroke="#D49B28" stroke-width="2.3"/>
    <rect fill="#4A3718" height="22" rx="11" ry="11" stroke="#D49B28" stroke-width="1.5" width="56" x="654" y="564"/>
    <text class="badge" fill="#F9FAFB" text-anchor="middle" x="682.0" y="579">Neuron</text>
    <circle cx="676" cy="620.0" fill="none" r="4.5" stroke="#D49B28" stroke-width="2"/>
    <line stroke="#D49B28" stroke-width="1.9" x1="676" x2="690.0" y1="620.0" y2="620.0"/>
    <circle cx="690.0" cy="620.0" fill="#E0A12E" r="2.5"/>
    <line stroke="#D49B28" stroke-width="1.9" x1="676" x2="683.0" y1="620.0" y2="632.1243556529821"/>
    <circle cx="683.0" cy="632.1243556529821" fill="#E0A12E" r="2.5"/>
    <line stroke="#D49B28" stroke-width="1.9" x1="676" x2="669.0" y1="620.0" y2="632.1243556529821"/>
    <circle cx="669.0" cy="632.1243556529821" fill="#E0A12E" r="2.5"/>
    <line stroke="#D49B28" stroke-width="1.9" x1="676" x2="662.0" y1="620.0" y2="620.0"/>
    <circle cx="662.0" cy="620.0" fill="#E0A12E" r="2.5"/>
    <line stroke="#D49B28" stroke-width="1.9" x1="676" x2="669.0" y1="620.0" y2="607.8756443470179"/>
    <circle cx="669.0" cy="607.8756443470179" fill="#E0A12E" r="2.5"/>
    <line stroke="#D49B28" stroke-width="1.9" x1="676" x2="683.0" y1="620.0" y2="607.8756443470179"/>
    <circle cx="683.0" cy="607.8756443470179" fill="#E0A12E" r="2.5"/>
    <text class="node-title" x="710" y="617.0">D-QUORUM neuron</text>
    <text class="node-sub" x="710" y="639.0">5% of age bonus</text>
  </g>
  <!-- Informational voting relationship: D-QUORUM neuron -> Faucet neuron -->
  <path class="edge data" d="M 790,665 V 678 H 240 V 465" marker-end="url(#a-data)" stroke-width="3.1"/>
  <text class="node-sub" style="fill:#F9FAFB" transform="rotate(-90 188 670)" x="188" y="670">
    <tspan x="188" dy="0">Informs the faucet neuron vote,</tspan>
    <tspan x="188" dy="16">ensuring that maturity is earned</tspan>
    <tspan x="188" dy="16">through diligent voting</tspan>
  </text>
