<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" class="jf-diagram" height="380" role="img" version="1.1" viewBox="90 350 1040 340" width="1160">
  <defs>
    <style type="text/css"><![CDATA[
        .jf-diagram { font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .bg{fill:#ffffff;}
        .title{fill:#18212b;font-size:30px;font-weight:720;letter-spacing:-.35px}
        .subtitle{fill:#607080;font-size:14px;font-weight:520}
        .node-title{fill:#18212b;font-size:18px;font-weight:700}
        .node-sub{fill:#607080;font-size:13px;font-weight:520}
        .badge{font-size:11px;font-weight:760}
        .section{fill:#607080;font-size:12px;font-weight:760;letter-spacing:1.2px}
        .lane{fill:#607080;font-size:13px;font-weight:760;letter-spacing:.9px}
        .edge-label{fill:#18212b;font-size:12px;font-weight:650}
        .edge-mono{fill:#18212b;font-size:12px;font-weight:650;font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
        .legend{fill:#18212b;font-size:12px;font-weight:650}
        .note{fill:#607080;font-size:13px;font-weight:560}
        .small-title{fill:#18212b;font-size:15px;font-weight:700}
        .step-number{fill:#fff;font-size:12px;font-weight:800}
        .canister.jupiter rect.body{fill:#edf9f5;stroke:#118866;}
        .canister.system rect.body{fill:#f1f5fa;stroke:#53657a;}
        .canister.target rect.body{fill:#fafbfc;stroke:#8b96a3;}
        .canister.sns rect.body{fill:#f7f0fb;stroke:#8752b6;}
        .canister.blackhole rect.body{fill:#f5f1f7;stroke:#73517f;}
        .account path.body{fill:#fbfcfd;stroke:#778697;}
        .edge{fill:none;stroke-width:3.1;stroke-linecap:round;stroke-linejoin:round}
        .edge.icp{stroke:#c4870e;}
        .edge.cycles{stroke:#168c65;}
        .edge.token{stroke:#9b4dca;}
        .edge.data{stroke:#3977ba;stroke-dasharray:8 7;}
        .edge.control{stroke:#626b75;stroke-dasharray:2 7;}
        .edge.action{stroke:#2f6ee5;}
        .theme-bg{fill:#ffffff;}
        ]]></style>
    <marker id="a-icp" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="4">
      <path d="M0,0 L10,4 L0,8 z" fill="#c4870e"/>
    </marker>
    <marker id="a-cycles" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="4">
      <path d="M0,0 L10,4 L0,8 z" fill="#168c65"/>
    </marker>
    <marker id="a-token" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="4">
      <path d="M0,0 L10,4 L0,8 z" fill="#9b4dca"/>
    </marker>
    <marker id="a-data" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="4">
      <path d="M0,0 L10,4 L0,8 z" fill="#3977ba"/>
    </marker>
    <marker id="a-control" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="4">
      <path d="M0,0 L10,4 L0,8 z" fill="#626b75"/>
    </marker>
    <marker id="a-action" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="4">
      <path d="M0,0 L10,4 L0,8 z" fill="#2f6ee5"/>
    </marker>
  </defs>
  <title>Disburser maturity split</title>
  <desc>Disburser sends the age-neutral base to Faucet on the right. The separate age-bonus portion flows down from the bottom of Disburser and splits to SNS Rewards and the D-QUORUM neuron beneath it.</desc>
