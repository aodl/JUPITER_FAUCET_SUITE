<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" class="jf-diagram" height="380" role="img" version="1.1" viewBox="90 350 1040 340" width="1160">
  <defs>
    <style type="text/css"><![CDATA[
        .jf-diagram { font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .bg{fill:#000000;fill-opacity:0.50;}
        .title{fill:#F9FAFB;font-size:30px;font-weight:720;letter-spacing:-.35px}
        .subtitle{fill:#F9FAFB;font-size:14px;font-weight:520}
        .node-title{fill:#F9FAFB;font-size:18px;font-weight:700}
        .node-sub{fill:#F9FAFB;font-size:13px;font-weight:520}
        .badge{font-size:11px;font-weight:760}
        .section{fill:#F9FAFB;font-size:12px;font-weight:760;letter-spacing:1.2px}
        .lane{fill:#F9FAFB;font-size:13px;font-weight:760;letter-spacing:.9px}
        .edge-label{fill:#F9FAFB;font-size:12px;font-weight:650}
        .edge-mono{fill:#F9FAFB;font-size:12px;font-weight:650;font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
        .legend{fill:#F9FAFB;font-size:12px;font-weight:650}
        .note{fill:#F9FAFB;font-size:13px;font-weight:560}
        .small-title{fill:#F9FAFB;font-size:15px;font-weight:700}
        .step-number{fill:#fff;font-size:12px;font-weight:800}
        .canister.jupiter rect.body{fill:#18483C;stroke:#2CC39A;}
        .canister.system rect.body{fill:#24384C;stroke:#7E97B8;}
        .canister.target rect.body{fill:#24384C;stroke:#8CA2C0;}
        .canister.sns rect.body{fill:#433052;stroke:#BA88E8;}
        .canister.blackhole rect.body{fill:#261D2A;stroke:#65486F;}
        .account path.body{fill:#24384C;stroke:#8CA2C0;}
        .edge{fill:none;stroke-width:3.1;stroke-linecap:round;stroke-linejoin:round}
        .edge.icp{stroke:#E6AA2F;}
        .edge.cycles{stroke:#35C69E;}
        .edge.token{stroke:#C391ED;}
        .edge.data{stroke:#5B9BE2;stroke-dasharray:8 7;}
        .edge.control{stroke:#94A3B8;stroke-dasharray:2 7;}
        .edge.action{stroke:#5B8EE6;}
        .theme-bg{fill:#000000;fill-opacity:0.50;}
        ]]></style>
    <marker id="a-icp" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="4">
      <path d="M0,0 L10,4 L0,8 z" fill="#E6AA2F"/>
    </marker>
    <marker id="a-cycles" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="4">
      <path d="M0,0 L10,4 L0,8 z" fill="#35C69E"/>
    </marker>
    <marker id="a-token" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="4">
      <path d="M0,0 L10,4 L0,8 z" fill="#C391ED"/>
    </marker>
    <marker id="a-data" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="4">
      <path d="M0,0 L10,4 L0,8 z" fill="#5B9BE2"/>
    </marker>
    <marker id="a-control" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="4">
      <path d="M0,0 L10,4 L0,8 z" fill="#94A3B8"/>
    </marker>
    <marker id="a-action" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="4">
      <path d="M0,0 L10,4 L0,8 z" fill="#5B8EE6"/>
    </marker>
  </defs>
  <title>Disburser maturity split</title>
  <desc>Disburser sends the age-neutral base to Faucet on the right. The separate age-bonus portion flows down from the bottom of Disburser and splits to SNS Rewards and the D-QUORUM neuron beneath it.</desc>
  <rect class="bg" x="90" y="350" width="1040" height="340" rx="24" ry="24"/>
  <path class="edge icp" d="M 360,420 L 480,420" marker-end="url(#a-icp)" stroke-width="3.1"/>
  <rect fill="#111827" height="24" rx="12" ry="12" stroke="#6F8094" stroke-width="1.1" width="74.8" x="382.6" y="393"/>
  <text class="edge-label" text-anchor="middle" x="420" y="410">maturity</text>
  <path class="edge icp" d="M 710,420 H 850" marker-end="url(#a-icp)" stroke-width="3.1"/>
  <rect fill="#111827" height="24" rx="12" ry="12" stroke="#6F8094" stroke-width="1.1" width="96.1" x="731.95" y="393"/>
  <text class="edge-label" text-anchor="middle" x="780" y="410">base reward</text>
  <rect fill="#111827" height="24" rx="12" ry="12" stroke="#6F8094" stroke-width="1.1" width="52" x="754" y="429"/>
  <text class="edge-label" text-anchor="middle" x="780" y="446">100%</text>
  <path class="edge icp" d="M 595,465 V 540" stroke-width="3.1"/>
  <rect fill="#111827" height="24" rx="12" ry="12" stroke="#6F8094" stroke-width="1.1" width="81.9" x="615" y="488"/>
  <text class="edge-label" text-anchor="middle" x="655.95" y="505">age bonus</text>
  <circle cx="595" cy="540" fill="#E6AA2F" r="6" stroke="#6F8094" stroke-width="2"/>
  <path class="edge icp" d="M 595,540 H 470 V 575" marker-end="url(#a-icp)" stroke-width="3.1"/>
  <rect fill="#111827" height="24" rx="12" ry="12" stroke="#6F8094" stroke-width="1.1" width="46" x="498" y="547"/>
  <text class="edge-label" text-anchor="middle" x="521" y="564">95%</text>
  <path class="edge icp" d="M 595,540 H 790 V 575" marker-end="url(#a-icp)" stroke-width="3.1"/>
  <rect fill="#111827" height="24" rx="12" ry="12" stroke="#6F8094" stroke-width="1.1" width="46" x="716" y="547"/>
  <text class="edge-label" text-anchor="middle" x="739" y="564">5%</text>
