id = "RUSTSEC-2024-0436"
reason = "paste 1.0.15 via candid 0.10.29, including production Candid derive/build paths for canisters/{disburser,faucet,historian,relay,lifeline}; it appears in wasm normal/build trees as a proc-macro dependency, not runtime code. Classification: production-proc-macro-only. The current latest candid 0.10.35 still depends on paste 1.0, so no advisory-removing Candid upgrade is available; ic-cdk is already current where compatible. Mitigation: keep dependency direct and current, track candid removal. Scope enforcement: tools/scripts/security-scan verifies paste may appear only as proc-macro support, not as runtime logic or broader build-only support, in production value-moving and privileged operational trees. Owner: protocol-maintainers."

[[IgnoredVulns]]
id = "RUSTSEC-2021-0127"
reason = "serde_cbor 0.11.2 via the locked ic-asset-certification 3.2.0/ic-http-certification 3.2.0 frontend production HTTP-certification path and via pocket-ic 15.0.0 dev/test tooling. Classification: frontend-production-certification, with additional dev-test-only PocketIC paths. Frontend integrity is security-relevant: its assets serve donor-facing payment destinations and the certificate-verification UI. Protocol maintainers accept the scoped unmaintained-CBOR dependency risk; absence from backend value-moving runtime paths does not make the frontend harmless. Mitigation: retain pinned certification dependencies, confine PocketIC to dev/test, and review removal when the supported upstream path permits it. Scope enforcement: tools/scripts/security-scan verifies this package is absent from production value-moving or privileged operational canister runtime paths. Owner: protocol-maintainers."
