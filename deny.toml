[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
allow-workspace = true

[[bans.skip]]
name = "darling"
version = "=0.20.11"
reason = "derive_builder 0.20.2 via handlebars/candid_parser requires darling 0.20 while ic-cdk-macros requires darling 0.23."

[[bans.skip]]
name = "darling_core"
version = "=0.20.11"
reason = "derive_builder 0.20.2 via handlebars/candid_parser requires darling_core 0.20 while ic-cdk-macros requires darling_core 0.23."

[[bans.skip]]
name = "darling_macro"
version = "=0.20.11"
reason = "derive_builder 0.20.2 via handlebars/candid_parser requires darling_macro 0.20 while ic-cdk-macros requires darling_macro 0.23."

[[bans.skip]]
name = "syn"
version = "=1.0.109"
reason = "binread_derive and older Candid parser tooling require syn 1.x while current IC derive and tooling dependencies require syn 2.x."

[[bans.skip]]
name = "thiserror"
version = "=1.0.69"
reason = "candid 0.10.29 requires thiserror 1.x while current IC/CDK dependencies require thiserror 2.x."

[[bans.skip]]
name = "thiserror-impl"
version = "=1.0.69"
reason = "candid 0.10.29 requires thiserror-impl 1.x while current IC/CDK dependencies require thiserror-impl 2.x."

[[bans.skip]]
name = "unicode-width"
version = "=0.1.14"
reason = "codespan-reporting 0.11 via candid_parser requires unicode-width 0.1 while pretty requires unicode-width 0.2."

[[bans.skip]]
name = "windows-sys"
version = "=0.59.0"
reason = "stacker 0.1.23 via candid requires windows-sys 0.59 while current system and dev tooling requires windows-sys 0.61."

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
unused-allowed-source = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The published icrc-ledger-types 0.2.0 omits the committed Index transaction
# schema's authorized_mint/authorized_burn fields and official 122mint constant.
# Cargo.toml pins DFINITY's reviewed mainline ICRC-122/152 merge revision.
allow-git = ["https://github.com/dfinity/ic"]
