[package]
name = "mock-icrc-ledger"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# Admission tests need a persistent callee-side read counter. Ordinary query
# execution discards writes; other scenarios keep the default Ledger surface.
balance_read_counter = []

[dependencies]
candid = { workspace = true }
serde = { workspace = true }
ic-cdk = { workspace = true }
icrc-ledger-types = { workspace = true }
num-traits = { workspace = true }
jupiter-ic-clients = { version = "0.1.0", path = "../../../crates/ic-clients" }
